# Quality gate configuration for the Code Reviewer.
#
# This file holds the defaults. A project can override any of these values by
# putting its own quality-gates.yml in its root folder; only the keys it sets
# are changed.

gates:
  build:            { enabled: true, severity: blocker }
  tests:            { enabled: true, severity: blocker, min_pass_rate: 100, timeout_seconds: 600 }
  coverage_new:     { enabled: true, severity: blocker, min: 80 }
  coverage_overall: { enabled: true, severity: warn, min: 70 }
  secrets:          { enabled: true, severity: blocker, max_findings: 0 }
  sast:             { enabled: true, severity: blocker, max_high: 0, max_critical: 0 }
  dependencies:     { enabled: false, severity: blocker, max_high: 0, max_critical: 0 }   # Trivy is turned off below
  lint:             { enabled: true, severity: blocker, max_errors: 0 }
  types:            { enabled: true, severity: blocker, max_errors: 0 }
  complexity:       { enabled: true, warn_over: 15, fail_over: 25 }
  duplication:      { enabled: true, severity: warn, max_percent: 5 }
  size:             { enabled: true, severity: warn, max_function_lines: 60, max_file_lines: 500 }
  debug_leftovers:  { enabled: true, severity: warn }
  diff:             { enabled: true, severity: warn, max_changed_lines: 400 }
  tests_with_source: { enabled: true, severity: warn }
  sonarqube:        { enabled: true, severity: blocker }

verdict:
  # A blocker gate whose tool is missing can't prove the code is safe, so it
  # lowers a PASS to WARN instead of passing silently.
  skipped_blocker_is_warn: true

# Folders and files no scanner looks at (glob patterns, matched against paths
# relative to the project root). A project can add more in a .reviewerignore file.
exclude:
  - .git
  - .hg
  - .svn
  - venv
  - .venv
  - env
  - node_modules
  - __pycache__
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .tox
  - dist
  - build
  - site-packages
  - vendor
  - third_party
  - cloned_projects
  - reports
  - data
  - "_backup*"
  - "trivy-*"
  - "*.min.js"
  - "*.min.css"
  - "*.map"
  - "*.lock"
  - "package-lock.json"

# Scanners to turn off completely, by name (as shown in the scan log), e.g. Trivy
# stops dependency scanning of pom.xml / requirements.txt / package-lock.json.
disabled_scanners: ["Trivy"]

# Only report findings on lines changed since this git ref (e.g. "main").
# Leave empty to review the whole project. Can also be set per scan.
base_ref: ""

semgrep:
  # Language packs are added automatically for the languages found.
  configs: ["p/owasp-top-ten", "p/secrets"]
  drop_low_confidence: true
  timeout_seconds: 900

maven:
  # One Maven run compiles, runs the tests and measures coverage with JaCoCo
  # (no pom.xml changes needed). Uses the project's mvnw if it has one.
  timeout_seconds: 1800
  jacoco_version: "0.8.12"
  extra_args: []          # e.g. ["-P", "ci"] or ["-s", "C:/path/settings.xml"]

pmd:
  rulesets: ["rulesets/java/quickstart.xml"]
  timeout_seconds: 900

bandit:
  skip: ["B101"]          # assert_used: mostly noise outside production code
  drop_low_confidence: true

secrets:
  # Paths whose matches are treated as test data and downgraded.
  test_path_patterns: ["test", "tests", "spec", "fixtures", "examples", "sample"]

tests:
  # Running a project's tests executes its code. Keep this off for repos you
  # don't trust (anything cloned from GitHub).
  run_for_remote_repos: false

ai:
  enabled: true
  provider: ""            # groq | openai | ollama ; empty = pick from environment
  model: ""               # empty = provider default
  min_severity: MEDIUM    # only findings at or above this are sent to the AI
  max_findings: 40
  max_workers: 4
  context_lines: 20
  # Findings the AI marks FALSE_POSITIVE with at least this confidence are moved
  # to a separate list and don't count towards the verdict.
  dismiss_false_positives: true
  dismiss_confidence: 0.8
  # Severity is only changed when the AI is at least this confident.
  override_confidence: 0.8
  # Whole-file review of changed files (needs base_ref).
  file_review: true
  file_review_max_lines: 400

server:
  # Local folders the dashboard may scan. Empty = your home folder only.
  # Can also be set with the REVIEWER_ALLOWED_ROOTS environment variable
  # (separate several folders with ; on Windows or : elsewhere).
  allowed_roots: []

tools:
  # Optional explicit paths to tool executables.
  trivy: ""
  gitleaks: ""
  semgrep: ""
  pmd: ""                 # e.g. C:/tools/pmd-bin-7.7.0/bin/pmd.bat
  mvn: ""
